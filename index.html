<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KIT Coffee premium trilingual menu: қазақша, русский, English."
    />
    <title>KIT Coffee | Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand-system" href="#breakfast-1" aria-label="KIT Coffee">
          <span class="brand-logo kit-logo">
            <img src="assets/brand/kit-coffee-full-logo.png" alt="KIT Coffee" />
          </span>
        </a>

        <div class="topbar-tools">
          <div class="lang-switch" id="langSwitch" aria-label="Language"></div>
          <button class="icon-action" id="printMenu" type="button" title="PDF / Print">
            <span>PDF</span>
          </button>
        </div>

        <label class="search-box" for="menuSearch">
          <span aria-hidden="true">⌕</span>
          <input id="menuSearch" type="search" autocomplete="off" />
        </label>

        <nav class="category-rail" id="categoryRail" aria-label="Menu categories"></nav>
      </header>

      <main class="sheet-stack" id="sheetStack"></main>

      <button class="back-top" id="backTop" type="button" title="Top">↑</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
